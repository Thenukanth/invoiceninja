server {
    listen 80;
    server_name localhost;
    root /var/www/html/public; # <--- Ensure this says /html/public

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()"; #Remediation for Vulnerability 5: Missing "Permissions-Policy" HTTP Response Header (Security Misconfiguration)

    index index.php;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name; # <--- Ensure this says /html/public
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}